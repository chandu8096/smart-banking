<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Banking - Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #16324f;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0d5dcc;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #1677ff;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>Create Account</h1>

        <input
            type="text"
            id="name"
            placeholder="Full Name"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="registerUser()">
            Register
        </button>

        <div id="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script>

        function registerUser() {

            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            if (!name || !email || !password) {

                message.textContent =
                    "Please fill all fields.";

                return;
            }


            fetch(
                "http://localhost:8080/api/users/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name: name,

                        email: email,

                        password: password,

                        role: "CUSTOMER",

                        status: "ACTIVE"

                    })
                }
            )

            .then(async response => {

                const text =
                    await response.text();

                if (!response.ok) {

                    throw new Error(
                        text || "Registration failed"
                    );
                }

                return JSON.parse(text);
            })

            .then(data => {

                message.textContent =
                    "Registration successful! Redirecting to login...";

                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1500);

            })

            .catch(error => {

                console.error(
                    "Registration error:",
                    error
                );

                message.textContent =
                    "Registration failed: " +
                    error.message;
            });
        }

    </script>

</body>

</html>
